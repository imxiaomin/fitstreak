services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: fitstreak
      POSTGRES_DB: fitstreak
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell}
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - fitstreak-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitstreak"]
      interval: 5s
      retries: 10
volumes:
  fitstreak-data:
