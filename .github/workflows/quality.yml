name: Build test and document review
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run api:export
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: application-verification
          path: |
            docs/screenshots/
            docs/test-results-e2e.json
            test-results/
            apps/web/dist/build/
  document-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libreoffice-writer poppler-utils fonts-noto-cjk
      - run: python -m pip install python-docx pdf2image pillow
      - run: python scripts/render_docx.py docs/FitStreak-需求分析.docx --output_dir docs/.qa --emit_pdf --verbose
      - uses: actions/upload-artifact@v4
        with:
          name: document-page-review
          include-hidden-files: true
          path: docs/.qa/
