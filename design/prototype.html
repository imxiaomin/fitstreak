<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>FitStreak 交互原型</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f7f3;color:#264b36;font:15px system-ui,"Microsoft YaHei"}header{padding:22px 30px;background:white;border-bottom:1px solid #dce5d7;display:flex;justify-content:space-between;gap:15px}header small{color:#85947b}main{max-width:1120px;margin:35px auto;padding:0 20px}.layout{display:grid;grid-template-columns:175px 1fr;gap:25px}nav{display:flex;flex-direction:column;gap:12px}button{cursor:pointer;border:0;background:#e8efdf;color:#34593f;padding:13px 17px;border-radius:9px;font:inherit}nav button.active,.primary{background:#234c39;color:white}.panel{background:white;border:1px solid #dce5d7;border-radius:18px;padding:26px;margin-bottom:20px}.hero{background:#e8efdf;padding:35px;border-radius:20px;margin-bottom:20px}h1{font-size:30px}h2{font-size:19px}.muted{color:#86947b}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.number{font-size:36px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 0}.small{font-size:12px}input,select,textarea{display:block;width:100%;padding:12px;border:1px solid #cedbc6;border-radius:8px;margin:8px 0 20px;font:inherit}dialog{max-width:480px;width:90%;border:0;border-radius:20px;padding:25px}dialog::backdrop{background:#183d3066}.bar{display:inline-block;width:9%;margin:0 2%;background:#91ad77;border-radius:6px 6px 0 0}.chart{height:140px;display:flex;align-items:end;justify-content:space-between}.tag{padding:6px;background:#eaf0e3;border-radius:5px}.actions{display:flex;gap:10px;justify-content:flex-end}@media(max-width:700px){header{padding:18px;font-size:12px}.layout{grid-template-columns:1fr}nav{flex-direction:row;overflow:auto}nav button{white-space:nowrap;font-size:11px;padding:10px}main{margin-top:20px}.grid{gap:8px}.grid .panel{padding:15px}.hero{padding:22px}h1{font-size:25px}}
</style><header><strong>↗ FitStreak · 日积一练</strong><small>交互原型 · 示例数据 · <a href="FitStreak-prototype.drawio" download>下载可编辑源文件</a></small></header><main><div class="layout"><nav id="nav"></nav><section id="screen"></section></div></main><dialog id="form"><form id="planForm"><h2>创建训练计划</h2><label>计划名称<input name="title" required maxlength="80" placeholder="例如：晨间慢跑"></label><label>目标分钟<input name="minutes" type="number" min="1" max="600" value="30" required></label><label>运动类型<select name="activity"><option>跑步</option><option>瑜伽</option><option>力量</option><option>步行</option></select></label><label>训练日<input value="周一至周日"></label><p class="small muted">此原型只用于交互评审；完整校验见运行中的前端。</p><div class="actions"><button type="button" onclick="document.querySelector('#form').close()">取消</button><button class="primary">保存</button></div></form></dialog><script>
const names=['今日概览','训练计划','运动数据','健身知识','个人中心'];let current=0,minutes=150,count=5;let plans=[{title:'晨间舒展',minutes:20,activity:'瑜伽',done:false},{title:'轻松慢跑',minutes:30,activity:'跑步',done:false}];const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){document.querySelector('#nav').innerHTML=names.map((x,i)=>`<button class="${current===i?'active':''}" onclick="go(${i})">${x}</button>`).join('');let rows=plans.map((p,i)=>`<div class="row"><div><strong>${esc(p.title)}</strong><p class="muted small">${esc(p.activity)} · ${p.minutes} 分钟</p></div><button onclick="check(${i})" ${p.done?'disabled':''}>${p.done?'已完成':'去打卡 →'}</button></div>`).join('');let metrics=`<div class="grid"><div class="panel"><p>运动分钟</p><b class="number">${minutes}</b></div><div class="panel"><p>完成打卡</p><b class="number">${count}</b></div><div class="panel"><p>连续天数</p><b class="number">3</b></div></div>`;let html='';
if(current===0)html=`<div class="hero"><small>FITSTREAK / ONE DAY STRONGER</small><h1>今天，也为自己动起来。</h1><p class="muted">每一小步，都算数。按照自己的节奏，让坚持成为习惯。</p><button class="primary" onclick="openForm()">＋ 创建计划</button></div>${metrics}<div class="panel"><h2>今日训练</h2>${rows}</div>`;
if(current===1)html=`<div class="row"><h1>训练计划</h1><button class="primary" onclick="openForm()">＋ 创建计划</button></div><div class="panel">${rows||'<p>暂无计划，请先创建。</p>'}</div>`;
if(current===2)html=`<h1>运动数据</h1>${metrics}<div class="panel"><h2>最近七天趋势</h2><div class="chart">${[55,90,70,10,100,65,40].map(n=>`<div class="bar" style="height:${n}px"></div>`).join('')}</div><p class="muted small">示例图表，正式版本按实际打卡数据汇总。</p></div>`;
if(current===3)html=`<h1>好习惯，从了解开始。</h1>${['让运动成为日常的一部分','给每次训练一个清晰目标','为休息留出位置'].map(x=>`<div class="panel"><span class="tag small">习惯养成 · 3分钟</span><h2>${x}</h2><p class="muted">从一个可执行的小目标开始，记录自己的每一步。</p><button onclick="detail('${x}')">阅读文章 ↗</button></div>`).join('')}`;
if(current===4)html='<h1>个人中心</h1><div class="panel"><h2>Alex</h2><label>昵称<input value="Alex"></label><label>每周目标<input type="number" min="1" max="7" value="4"></label><p class="muted">语言与设置可在高保真前端切换与保存。</p><button class="primary" onclick="this.textContent=\'已保存（原型）\'">保存设置</button></div>';
document.querySelector('#screen').innerHTML=html;}
function go(i){current=i;render()}function openForm(){document.querySelector('#form').showModal()}function check(i){if(plans[i].done)return;plans[i].done=true;minutes+=plans[i].minutes;count++;render()}function detail(title){document.querySelector('#screen').innerHTML=`<div class="panel"><button onclick="go(3)">← 返回</button><h1>${esc(title)}</h1><p>选择适合自己的时段，记录每次训练的实际时长和感受。</p><p>偶尔中断时，从下一次计划继续。让运动成为日常的一部分。</p></div>`;}
document.querySelector('#planForm').onsubmit=e=>{e.preventDefault();const data=new FormData(e.target);plans.push({title:data.get('title'),minutes:Number(data.get('minutes')),activity:data.get('activity'),done:false});document.querySelector('#form').close();e.target.reset();current=1;render();};render();
</script></html>
